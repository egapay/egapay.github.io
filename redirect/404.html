<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ethan Gapay — now at ethangapay.com</title>
    <meta http-equiv="refresh" content="0; url=https://ethangapay.com/" />

    <script>
      // Unmatched paths under the old domain (/resume.pdf, /egapay.jpg, ...)
      // keep their path so the request resolves on the new domain instead of
      // dead-ending. The three project sites never reach this file — GitHub
      // serves /blackjack-analysis/ and friends from their own repos.
      location.replace(
        "https://ethangapay.com" +
          location.pathname +
          location.search +
          location.hash,
      );
    </script>

    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #08090a;
        color: #f4f4f5;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .label {
        margin: 0 0 0.75rem;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #f5b73d;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.75rem;
        color: #a1a1aa;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.25rem;
        border-radius: 0.5rem;
        background: #f4f4f5;
        color: #08090a;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Moved</p>
      <h1>ethangapay.com</h1>
      <p>This portfolio has a new home. Redirecting you now&hellip;</p>
      <a href="https://ethangapay.com/">Continue to ethangapay.com</a>
    </main>
  </body>
</html>
